[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "repomedic"
version = "0.1.0"
description = "A human-approved terminal workflow for AI-assisted repository repair"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "openai>=1.68.0,<4",
    "pydantic>=2.8.0,<3",
    "typer>=0.12.0,<1",
    "rich>=13.9.0,<16",
    "python-dotenv>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10",
    "ruff>=0.9.0,<1",
]

[project.scripts]
repomedic = "repomedic.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
